[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-engine"
version = "0.1.0"
description = "LLM pipeline for adaptive certification course generation: syllabus -> assessment -> grading -> roadmap"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]
dev = ["pytest>=8.0", "rich>=13.0"]
backend = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "mysqlclient>=2.2",
    "django-cors-headers>=4.4",
    "pytest-django>=4.8",
    "pyjwt[crypto]>=2.8",
    "certifi>=2024.0",
]

[tool.setuptools.packages.find]
include = ["llm_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
